<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>westy_scan 控制台</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e6e6;--muted:#9aa4b2;--line:#2a2f3a;--accent:#3b82f6;--ok:#3fb950;--warn:#d29922;--crit:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#12151b;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;font-weight:600}
header .sp{flex:1}
input,select,textarea,button{font:inherit;background:#0b0d11;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
main{padding:20px;max-width:1280px;margin:0 auto}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:110px}
.card .n{font-size:22px;font-weight:600}
.card .k{color:var(--muted);font-size:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
section h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.sev{padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.critical{background:var(--crit);color:#fff}.high{background:#b62324;color:#fff}
.medium{background:var(--warn);color:#1a1a1a}.low{background:#2d6a8a;color:#fff}.info{background:#39414d;color:#fff}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
pre{background:#0b0d11;border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;max-height:280px}
.ok{color:var(--ok)}.err{color:var(--crit)}
</style>
</head>
<body>
<header>
  <h1>westy_scan 控制台</h1>
  <span class="muted" id="ver"></span>
  <span class="sp"></span>
  <input id="token" type="password" placeholder="访问 token" style="width:220px">
  <button onclick="saveToken()">保存</button>
  <button class="ghost" onclick="refreshAll()">刷新</button>
</header>
<main>
  <div id="msg" class="muted"></div>
  <div class="cards" id="cards"></div>

  <section>
    <h2>发起扫描（必须关联有效授权书）</h2>
    <div class="row">
      <input id="targets" placeholder="目标：10.0.0.0/24 或 demo.example.com" style="min-width:320px">
      <input id="ports" placeholder="端口：common / 80,443 / 1-1024" value="common" style="width:200px">
      <input id="authz" placeholder="授权书编号" style="width:180px">
      <input id="jobports" type="number" placeholder="端口分片" value="0" style="width:110px">
      <button onclick="createScan()">创建扫描</button>
    </div>
    <div class="muted">没有授权书 → 服务端会直接拒绝（这是合规闸门，不是建议）。</div>
  </section>

  <section>
    <h2>扫描任务</h2>
    <table><thead><tr><th>扫描 ID</th><th>创建时间</th><th>任务</th><th>完成/失败</th><th>资产</th><th>漏洞</th><th>操作</th></tr></thead>
    <tbody id="scans"></tbody></table>
  </section>

  <section>
    <h2>漏洞（按级别排序）</h2>
    <div class="row">
      最低级别
      <select id="minsev" onchange="loadFindings()">
        <option value="">全部</option><option value="high">high</option>
        <option value="medium">medium</option><option value="critical">critical</option>
      </select>
      <span class="muted" id="findingsCount"></span>
    </div>
    <table><thead><tr><th>级别</th><th>模板</th><th>名称</th><th>命中地址</th><th>已验证</th><th>证据</th></tr></thead>
    <tbody id="findings"></tbody></table>
  </section>

  <section>
    <h2>资产</h2>
    <div class="row">
      <input id="hostFilter" placeholder="按主机过滤" oninput="loadAssets()" style="width:220px">
      <input id="assetLimit" type="number" value="200" onchange="loadAssets()" style="width:90px">
      <span class="muted" id="assetsCount"></span>
    </div>
    <table><thead><tr><th>主机</th><th>端口</th><th>服务</th><th>产品</th><th>版本</th><th>置信度</th><th>标题</th><th>CDN/WAF</th></tr></thead>
    <tbody id="assets"></tbody></table>
  </section>

  <section>
    <h2>扫描对比（找出"这次多了什么"）</h2>
    <div class="row">
      <input id="baseScan" placeholder="基线扫描 ID" style="width:280px">
      <input id="curScan" placeholder="本次扫描 ID" style="width:280px">
      <button onclick="loadDiff()">对比</button>
      <span class="muted" id="diffSummary"></span>
    </div>
    <div id="diffBody"></div>
  </section>

  <section>
    <h2>导出报告</h2>
    <div class="row">
      <input id="reportScan" placeholder="扫描 ID（留空=全部）" style="width:280px">
      <button onclick="openReport('html')">HTML</button>
      <button class="ghost" onclick="openReport('markdown')">Markdown</button>
      <button class="ghost" onclick="openReport('json')">JSON</button>
    </div>
    <div class="muted">HTML 报告是自包含的，可直接用浏览器"打印为 PDF"。</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
function token(){ return localStorage.getItem('westy_token') || ''; }
function saveToken(){ localStorage.setItem('westy_token', $('token').value.trim()); msg('已保存 token'); refreshAll(); }
function msg(t, cls){ const m=$('msg'); m.textContent=t; m.className = cls || 'muted'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Authorization':'Bearer '+token()}, opts.headers||{});
  const r = await fetch(path, opts);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if (!r.ok) throw new Error((data && data.error) ? data.error : (r.status+' '+r.statusText));
  return data;
}
function refreshAll(){ loadStats(); loadScans(); loadFindings(); loadAssets(); }

async function loadStats(){
  try{
    const st = await api('/api/v1/stats');
    $('ver').textContent = '协议 v' + st.protocol + '｜运行 ' + st.uptime_seconds + 's';
    const t = st.tasks || {};
    const cards = [
      ['资产', st.assets], ['漏洞', st.findings],
      ['待执行', t.pending||0], ['执行中', t.running||0],
      ['完成', t.done||0], ['失败', t.failed||0],
      ['Agent', (st.agents||[]).length]
    ];
    $('cards').innerHTML = cards.map(c => '<div class="card"><div class="n">'+esc(c[1])+'</div><div class="k">'+esc(c[0])+'</div></div>').join('');
  }catch(e){ msg('读取统计失败：'+e.message, 'err'); }
}
async function loadScans(){
  try{
    const list = await api('/api/v1/scans');
    $('scans').innerHTML = (list||[]).map(s =>
      '<tr><td><code>'+esc(s.id)+'</code></td><td>'+esc(new Date(s.created_at).toLocaleString())+'</td><td>'+s.tasks+
      '</td><td>'+s.done+' / '+s.failed+'</td><td>'+s.assets+'</td><td>'+s.findings+
      '</td><td><button class="ghost" onclick="useScan(\''+esc(s.id)+'\')">用作文本/基线</button></td></tr>'
    ).join('') || '<tr><td colspan="7" class="muted">暂无扫描</td></tr>';
  }catch(e){ msg('读取扫描失败：'+e.message, 'err'); }
}
function useScan(id){ $('curScan').value = id; $('reportScan').value = id; msg('已填入 '+id); }
async function createScan(){
  const targets = $('targets').value.split(/[,\s]+/).filter(Boolean);
  const ports = $('ports').value.trim() || 'common';
  const portList = await expandPorts(ports);
  try{
    const info = await api('/api/v1/scans', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({hosts: targets, ports: portList, authorization: $('authz').value.trim(),
                            job_ports: parseInt($('jobports').value||'0',10)})
    });
    msg('已创建扫描 '+info.id+'（任务 '+info.tasks+'）', 'ok');
    refreshAll();
  }catch(e){ msg('创建失败：'+e.message, 'err'); }
}
// 端口解析放在前端做：服务端的 ScanSpec 接收的是端口数组
async function expandPorts(spec){
  if (/^\d+(,\d+)*$/.test(spec)) return spec.split(',').map(Number);
  if (/^\d+-\d+$/.test(spec)) { const [a,b]=spec.split('-').map(Number); const out=[]; for(let i=a;i<=b;i++) out.push(i); return out; }
  // 命名端口组：与 CLI 保持一致的精简副本
  const groups = {
    web:[80,81,443,3000,4443,5000,5601,7001,8000,8008,8009,8080,8081,8088,8090,8443,8888,9000,9001,9090,9200,9443,10000],
    db:[1433,1521,2181,3306,5432,5672,6379,9042,9200,9300,11211,27017],
    common:[21,22,23,25,53,80,81,110,111,135,139,143,161,389,443,445,465,587,636,873,993,995,1080,1433,1521,1723,1883,2049,2181,2375,2376,2379,3000,3306,3389,4443,4848,5000,5432,5601,5672,5900,5901,5985,5986,6379,6443,7001,8000,8080,8081,8088,8443,8888,9000,9001,9042,9090,9200,9300,9443,10000,11211,15672,27017],
    all: (()=>{ const o=[]; for(let i=1;i<=65535;i++) o.push(i); return o; })()
  };
  return groups[spec] || groups.common;
}
async function loadFindings(){
  try{
    const list = await api('/api/v1/findings?min_severity='+encodeURIComponent($('minsev').value)+'&limit=300');
    $('findingsCount').textContent = '共 ' + (list||[]).length + ' 条';
    $('findings').innerHTML = (list||[]).map(f =>
      '<tr><td><span class="sev '+esc((f.severity||'').toLowerCase())+'">'+esc((f.severity||'').toUpperCase())+'</span></td>'+
      '<td><code>'+esc(f.template_id)+'</code></td><td>'+esc(f.name)+'</td><td>'+esc(f.matched_at)+'</td>'+
      '<td>'+(f.verified?'是':'否')+'</td>'+
      '<td><button class="ghost" onclick="showEvidence(\''+esc(f.template_id)+'\',\''+esc(f.matched_at)+'\')">查看</button></td></tr>'
    ).join('') || '<tr><td colspan="6" class="muted">未发现漏洞</td></tr>';
    window.__findings = list||[];
  }catch(e){ msg('读取漏洞失败：'+e.message, 'err'); }
}
function showEvidence(tpl, matched){
  const f = (window.__findings||[]).find(x => x.template_id===tpl && x.matched_at===matched);
  if(!f) return;
  msg('证据已展开到下方');
  $('diffBody').innerHTML = '<h3>'+esc(f.name)+'</h3><p class="muted">匹配依据：'+esc(f.evidence.matcher)+'</p>'+
    '<pre>'+esc(f.evidence.request)+'</pre><pre>'+esc(f.evidence.response)+'</pre>';
}
async function loadAssets(){
  const host = encodeURIComponent($('hostFilter').value.trim());
  const limit = parseInt($('assetLimit').value||'200',10);
  try{
    const list = await api('/api/v1/assets?host='+host+'&limit='+limit);
    $('assetsCount').textContent = '共 ' + (list||[]).length + ' 条';
    $('assets').innerHTML = (list||[]).map(a =>
      '<tr><td>'+esc(a.host)+'</td><td>'+esc(a.port||'')+'</td><td>'+esc(a.service||'')+'</td>'+
      '<td>'+esc(a.product||'')+'</td><td>'+esc(a.version||'')+'</td><td>'+esc(a.confidence||'')+'</td>'+
      '<td>'+esc(a.title||'')+'</td><td>'+esc(a.cdn||a.waf||'')+'</td></tr>'
    ).join('') || '<tr><td colspan="8" class="muted">暂无资产</td></tr>';
  }catch(e){ msg('读取资产失败：'+e.message, 'err'); }
}
async function loadDiff(){
  try{
    const res = await api('/api/v1/scans/diff?scan_id='+encodeURIComponent($('curScan').value.trim())+
                          '&against='+encodeURIComponent($('baseScan').value.trim()));
    const s = res.summary||{};
    $('diffSummary').textContent = '新增资产 '+s.new_assets+'｜消失 '+s.gone_assets+'｜变化 '+s.changed_assets+
      '｜新增漏洞 '+s.new_findings+'（高危及以上 '+s.new_high_risk+'）｜已修复 '+s.fixed_findings;
    let html = '';
    const table = (title, rows, cols) => {
      if(!rows || !rows.length) return '';
      return '<h4>'+title+'</h4><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r => '<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    };
    html += table('新增资产', (res.new_assets||[]).map(a=>[a.host,a.port||'',a.service||'',a.product||'',a.version||'']),
      ['主机','端口','服务','产品','版本']);
    html += table('新增漏洞', (res.new_findings||[]).map(f=>[(f.severity||'').toUpperCase(),f.template_id,f.matched_at]),
      ['级别','模板','命中地址']);
    html += table('已修复漏洞', (res.fixed_findings||[]).map(f=>[(f.severity||'').toUpperCase(),f.template_id,f.matched_at]),
      ['级别','模板','命中地址']);
    html += table('属性变化', (res.changed_assets||[]).map(c=>[c.host,c.port||'',JSON.stringify(c.before),JSON.stringify(c.after)]),
      ['主机','端口','之前','之后']);
    html += table('消失资产', (res.gone_assets||[]).map(a=>[a.host,a.port||'',a.service||'']), ['主机','端口','服务']);
    $('diffBody').innerHTML = html || '<p class="muted">两次扫描之间没有差异</p>';
  }catch(e){ msg('对比失败：'+e.message, 'err'); }
}
function openReport(format){
  const id = $('reportScan').value.trim();
  fetch('/api/v1/report?format='+format+'&scan_id='+encodeURIComponent(id), {headers:{'Authorization':'Bearer '+token()}})
    .then(r => r.text()).then(t => {
      const w = window.open('', '_blank');
      if(format==='html'){ w.document.write(t); w.document.close(); }
      else { w.document.write('<pre style="white-space:pre-wrap">'+esc(t)+'</pre>'); w.document.close(); }
    }).catch(e => msg('导出失败：'+e.message, 'err'));
}
$('token').value = token();
refreshAll();
setInterval(loadStats, 5000);
</script>
</body>
</html>
